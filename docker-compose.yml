services:
  app:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
    container_name: taskflow
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/taskflow.db
      BASE_PATH: ${BASE_PATH:-/}
      NODE_ENV: production
    restart: unless-stopped
