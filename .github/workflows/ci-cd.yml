name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit_coverage:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    needs: unit_coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build verification
        run: npm run build

  e2e:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build

      - name: Kill stale processes on port 3000
        run: lsof -ti:3000 | xargs -r kill -9 || true

      - name: Run end-to-end verification
        run: npm run test:e2e
        env:
          CI: true
          DISPLAY: ":99"

  # NOTE: This job is a personal deployment example using a self-hosted runner and a
  # local deploy script (~/scripts/deploy.sh). It will not work out-of-the-box for
  # other setups. Replace or remove it to match your own deployment infrastructure.
  deploy:
    if: github.event_name == 'push'
    needs: [unit_coverage, build, e2e]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t taskflow:${{ github.sha }} \
            -t taskflow:latest \
            .

      - name: Deploy
        run: ~/scripts/deploy.sh taskflow
