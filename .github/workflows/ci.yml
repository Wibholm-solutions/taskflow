name: CI

# Runs on the trusted development-PC CI lane only. Every job requests the exact
# lane labels, and the pull-request guard keeps fork code off the runner.
#
# This replaces ci-cd.yml, which ran its unit, build and end-to-end jobs on
# GitHub-hosted `ubuntu-latest` runners and published nothing. Hosted runners are
# forbidden by the workspace's zero-cost policy, and the running container on
# `homelab` was built on the server from a working copy, so nothing
# digest-identified existed for the deployment lane to converge. The image is
# now published to GHCR as an immutable digest, which is the identity the
# development-PC deployment lane converges.
#
# BASE_PATH is a **build-time** argument, not just a runtime one: vite bundles
# the client with that asset base, so an image built at `/` cannot be served
# under `/todo` however the container is configured afterwards. The published
# image is therefore built for the route it is deployed to.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dev-pc-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pull requests build the image but never publish it, so a broken Dockerfile
    # is caught before it reaches master without granting fork code a registry
    # credential.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, dev-pc, ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the image without publishing it
        shell: bash
        run: |
          set -euo pipefail
          # buildx keeps builder state under $DOCKER_CONFIG, and the lane host's
          # home directory is read-only, so the default location fails with
          # "read-only file system" before the build starts. Relocating the whole
          # Docker config is what the publish job already does for its registry
          # credential; the build needs it for the same reason.
          export DOCKER_CONFIG="$(mktemp -d /dev/shm/taskflow-build.XXXXXX)"
          chmod 0700 "$DOCKER_CONFIG"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          docker buildx build --file Dockerfile --build-arg BASE_PATH=/todo --tag "taskflow:pr-${GITHUB_SHA}" .

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, dev-pc, ci]
    permissions:
      contents: read
      packages: write
    outputs:
      # The digest is the deployment identity. Exposing it as a job output is what
      # lets a promotion request name an image by identity rather than by tag.
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-spend gate
        shell: bash
        run: /usr/local/lib/homelab-ci/assert-zero-spend-gate.sh

      - name: Build and publish a digest-identified image with open attestations
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          # Provenance tag only. The digest is the identity, and no `latest` or
          # semantic alias is published, so no alias can authorise a deployment.
          image="ghcr.io/${repository}:sha-${GITHUB_SHA}"
          export DOCKER_CONFIG="$(mktemp -d /dev/shm/taskflow-docker.XXXXXX)"
          chmod 0700 "$DOCKER_CONFIG"
          cleanup_registry_auth() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup_registry_auth EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --file Dockerfile \
            --build-arg BASE_PATH=/todo \
            --tag "$image" \
            --sbom=true \
            --provenance=mode=max \
            --push \
            .
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          sbom_json="$(docker buildx imagetools inspect "$image" --format '{{json .SBOM.SPDX}}')"
          if ! printf '%s\n' "$sbom_json" | jq -e '.SPDXID | type == "string" and length > 0' >/dev/null; then
            echo 'published image is missing an SPDX SBOM' >&2
            exit 1
          fi
          echo 'verified-sbom-spdx'
          provenance_json="$(docker buildx imagetools inspect "$image" --format '{{json .Provenance.SLSA}}')"
          if ! printf '%s\n' "$provenance_json" | jq -e \
            '(.buildType // .buildDefinition.buildType // .predicate.buildType) | type == "string" and length > 0' >/dev/null; then
            echo 'published image is missing SLSA provenance' >&2
            exit 1
          fi
          echo 'verified-slsa-provenance'
          if ! printf '%s\n' "$provenance_json" | jq -e \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_repository "$repository" \
            'tostring | ascii_downcase | contains($source_commit) and contains($source_repository)' >/dev/null; then
            echo 'SLSA provenance is not bound to the source repository and commit' >&2
            exit 1
          fi
          echo 'verified-slsa-provenance-source'
          # The promotion request is only as trustworthy as this string, so it is
          # checked here rather than at the receiver, which would reject it anyway.
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "published digest is not an immutable sha256 identity: $digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          echo "published ghcr.io/${repository}@${digest}"
          {
            echo "### Published image"
            echo
            echo "- digest: \`ghcr.io/${repository}@${digest}\`"
            echo "- provenance tag: \`sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The other end of the lane. Without this job a merge to master publishes a
  # digest that nothing consumes, and shipping means hand-editing
  # desired-state.json in saabendtsen/home-server. This job asks for the
  # promotion; it decides nothing.
  #
  # It never touches the server and holds no deployment credential of its own. It
  # sends one repository_dispatch to the infrastructure repository, whose receiver
  # re-validates every field from scratch against the checked-in lane contract and
  # then deploys, verifies and records, rolling back to the known-good digest if
  # the verification contract fails. A request this job could forge is refused
  # there.
  #
  # The `vars.DEPLOY_APP_ID` guard is deliberate. The cross-repository GitHub App
  # credential is held only by the repository owner, so until it is configured this
  # job skips rather than failing the build -- and a promotion is never sent out of
  # band to compensate.
  promote:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_APP_ID != ''
    runs-on: [self-hosted, linux, x64, dev-pc, ci]
    permissions:
      contents: read
    env:
      APPLICATION: taskflow
    steps:
      - name: Mint a short-lived cross-repository token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: saabendtsen
          repositories: home-server

      - name: Send the promotion request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          # The request is nested under a single `request` property because a
          # repository_dispatch client_payload may carry at most 10 top-level
          # properties, and a promotion request has 11 required fields. Sent flat,
          # the API rejects it before the receiver ever sees it.
          jq -n \
            --arg request_id "promotion-$(date -u +%Y-%m-%d)-$(printf '%04d' "$GITHUB_RUN_NUMBER")" \
            --arg application "${APPLICATION}" \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg image "ghcr.io/wibholm-solutions/${APPLICATION}" \
            --arg digest "${DIGEST}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
               event_type: "promotion-request",
               client_payload: {
                 request: {
                   schema_version: 1,
                   request_id: $request_id,
                   application: $application,
                   host: "homelab",
                   source_repository: $source_repository,
                   image: $image,
                   digest: $digest,
                   source_commit: $source_commit,
                   source_workflow_run: $run,
                   runtime_contract_version: "1.0.0",
                   requested_at: $requested_at
                 }
               }
             }' \
            | gh api repos/saabendtsen/home-server/dispatches --input -
          {
            echo "### Promotion requested"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo "- receiver: https://github.com/saabendtsen/home-server/actions/workflows/promotion.yml"
          } >> "$GITHUB_STEP_SUMMARY"
